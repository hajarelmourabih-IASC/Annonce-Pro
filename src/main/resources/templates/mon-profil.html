<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace Pro | AnnoncesPro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            /* Changement du thème : Mauve -> Bleu */
            --primary: #2563eb; 
            --bg-gradient: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; }

        /* Navigation Flottante */
        .top-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1100px; z-index: 1000;
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 100px; padding: 12px 25px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid white;
        }

        /* Onglets style */
        .nav-pills .nav-link {
            color: #64748b; font-weight: 700; border-radius: 100px; padding: 10px 25px;
        }
        .nav-pills .nav-link.active {
            background: var(--bg-gradient) !important;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .welcome-header {
            background: var(--bg-gradient);
            padding: 140px 0 100px;
            text-align: center; color: white;
            clip-path: ellipse(150% 100% at 50% 0%);
            position: relative; z-index: 1;
        }

        .main-content { 
            margin-top: -50px; 
            position: relative; z-index: 10; 
            padding-bottom: 80px;
        }

        .dashboard-card { 
            border: none; border-radius: 28px; background: white; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-bottom: 30px;
        }

        .stat-box {
            background: white; border-radius: 24px; padding: 25px;
            border: 1px solid #f1f5f9; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .stat-box:hover { transform: translateY(-5px); border-color: var(--primary); }

        .avatar-edit-wrapper {
            position: relative; width: 130px; margin: -65px auto 25px;
        }
        .avatar-preview {
            width: 130px; height: 130px; border-radius: 45px; 
            object-fit: cover; border: 5px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .btn-upload {
            position: absolute; bottom: 0; right: 0; 
            background: var(--primary); color: white; border-radius: 14px; 
            padding: 8px; cursor: pointer; border: 3px solid white;
        }

        .opinion-section {
            background: #f0f7ff; border: 2px dashed #3b82f6; border-radius: 24px; padding: 30px;
        }

        .form-control {
            border-radius: 15px; padding: 12px 20px; border: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .btn-update {
            background: var(--bg-gradient); border: none; color: white;
            padding: 14px 35px; border-radius: 100px; font-weight: 700;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }
        .btn-update:hover { transform: scale(1.02); box-shadow: 0 15px 25px rgba(37, 99, 235, 0.3); }
        
        .annonce-card {
            border-radius: 20px; overflow: hidden; border: 1px solid #f1f5f9; transition: 0.3s;
        }
        .annonce-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a th:href="@{/}" class="text-decoration-none text-muted fw-600">
            <i class="fas fa-chevron-left me-1"></i> Retour
        </a>
        <div class="fw-800 text-primary">MON DASHBOARD</div>
        <a th:href="@{/logout}" class="text-decoration-none text-danger fw-600">
            Déconnexion <i class="fas fa-power-off ms-1"></i>
        </a>
    </nav>

    <header class="welcome-header">
        <div class="container">
            <h1 class="fw-800">👋 Bonjour, <span th:text="${user.nom}">Ami</span> !</h1>
            <p class="opacity-75">Gérez votre profil et vos annonces en un seul clic.</p>
        </div>
    </header>

    <main class="container main-content">
        <ul class="nav nav-pills justify-content-center mb-5" id="pills-tab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="btn-profil" data-bs-toggle="pill" data-bs-target="#tab-profil" type="button">
                    <i class="fas fa-user-circle me-2"></i>Mon Profil
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="btn-annonces" data-bs-toggle="pill" data-bs-target="#tab-annonces" type="button">
                    <i class="fas fa-bullhorn me-2"></i>Mes Annonces (<span th:text="${annonces.size()}">0</span>)
                </button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            
            <div class="tab-pane fade show active" id="tab-profil" role="tabpanel">
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="row g-4 mb-5">
                            <div class="col-md-4">
                                <div class="stat-box text-center">
                                    <i class="fas fa-eye text-primary mb-2 fa-2x"></i>
                                    <h4 class="fw-800 mb-0" th:text="${user.vuesTotales}">0</h4>
                                    <small class="text-muted">Vues cumulées</small>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-box text-center">
                                    <i class="fas fa-bullhorn text-primary mb-2 fa-2x"></i>
                                    <h4 class="fw-800 mb-0" th:text="${annonces.size()}">0</h4>
                                    <small class="text-muted">Annonces en ligne</small>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-box text-center">
                                    <i class="fas fa-star text-warning mb-2 fa-2x"></i>
                                    <h4 class="fw-800 mb-0" th:text="${user.score} + '/10'">10/10</h4>
                                    <small class="text-muted">Confiance client</small>
                                </div>
                            </div>
                        </div>

                        <div class="dashboard-card p-4 p-md-5">
                            <form th:action="@{/mon-profil/update}" method="post" enctype="multipart/form-data">
                                <div class="avatar-edit-wrapper">
                                    <img id="preview" th:src="${user.photoProfil != null ? '/uploads/'+user.photoProfil : 'https://ui-avatars.com/api/?background=2563eb&color=fff&name='+user.nom}" class="avatar-preview">
                                    <label for="fileInput" class="btn-upload"><i class="fas fa-camera"></i></label>
                                    <input type="file" id="fileInput" name="avatarFile" hidden onchange="showPreview(this)">
                                </div>

                                <div class="row g-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-700 small text-muted">NOM COMPLET</label>
                                        <input type="text" name="nom" th:value="${user.nom}" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-700 small text-muted">WHATSAPP</label>
                                        <input type="text" name="telephone" th:value="${user.telephone}" class="form-control" placeholder="06XXXXXXXX">
                                    </div>
                                    <div class="col-12 mt-5">
                                        <div class="opinion-section">
                                            <div class="d-flex align-items-center mb-3">
                                                <div class="bg-primary rounded-circle p-2 me-3"><i class="fas fa-comment-dots text-white"></i></div>
                                                <h5 class="fw-800 mb-0">Partagez votre avis sur l'application 🚀</h5>
                                            </div>
                                            <textarea name="témoignage" class="form-control bg-white" rows="3" th:text="${user.témoignage}"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-12 text-center mt-5">
                                        <button type="submit" class="btn btn-update px-5">Sauvegarder mon profil</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-annonces" role="tabpanel">
                <div class="row g-4">
                    <div class="col-md-4" th:each="ann : ${annonces}">
                        <div class="dashboard-card p-3 annonce-card">
                            <img th:src="@{'/uploads/' + ${ann.imageNom}}" class="img-fluid rounded-4 mb-3" style="height: 180px; width: 100%; object-fit: cover;">
                            <h6 class="fw-800 mb-1" th:text="${ann.titre}">Titre</h6>
                            <p class="text-primary fw-bold mb-3" th:text="${ann.prix} + ' DH'"></p>
                           <div class="d-flex flex-column gap-2">

    <div class="d-flex gap-2">
        <a th:href="@{'/annonce/modifier/' + ${ann.id}}"
           class="btn btn-sm btn-light rounded-pill w-100 fw-bold">
           Modifier
        </a>

        <a th:href="@{'/annonce/supprimer/' + ${ann.id}}"
           class="btn btn-sm btn-outline-danger rounded-circle"
           onclick="return confirm('Supprimer ?')">
           <i class="fas fa-trash"></i>
        </a>
    </div>

    <!-- 🔥 BOUTON VENDU -->
    <form th:if="${!ann.estVendu}"
          th:action="@{'/annonce/vendre/' + ${ann.id}}"
          method="post">

        <button class="btn btn-success w-100 rounded-pill fw-bold">
            ✅ Marquer comme vendu
        </button>
    </form>

    <!-- ✅ SI DEJA VENDU -->
    <div th:if="${ann.estVendu}" class="text-center">
        <span class="badge bg-success w-100 py-2 fs-6">
            ✔️ Déjà vendu
        </span>
    </div>

</div>
                        </div>
                    </div>
                    <div class="col-12 text-center py-5" th:if="${annonces.isEmpty()}">
                        <p class="text-muted">Vous n'avez aucune annonce.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash;
        if (hash === '#tab-annonces') {
            const tabBtn = document.querySelector('#btn-annonces');
            if (tabBtn) {
                const tab = new bootstrap.Tab(tabBtn);
                tab.show();
            }
        }
    });

    function showPreview(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) { document.getElementById('preview').src = e.target.result; }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
