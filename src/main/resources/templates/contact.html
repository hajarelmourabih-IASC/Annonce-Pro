<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Fun & Pro | AnnoncesPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #009ef7; 
            --accent: #ffc107; /* Jaune amusant */
            --bg-body: #f0f4f8;
            --surface: #ffffff;
        }
        
        body { 
            background-color: var(--bg-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #181c32;
            height: 100vh;
            overflow: hidden; /* Fixé pour l'aspect App */
        }

        /* --- LOGO AMUSANT --- */
        .mascot-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .mascot-icon {
            font-size: 2.5rem;
            color: var(--primary);
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* --- LAYOUT PRINCIPAL --- */
        .app-container {
            display: flex;
            height: calc(100vh - 80px);
            padding: 20px;
            gap: 20px;
        }

        /* --- SECTION GAUCHE (Formulaire + Guide) --- */
        .left-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto; /* Scroll si le guide est long */
            padding-right: 10px;
        }

        /* --- SECTION DROITE (Messages) --- */
        .right-panel {
            flex: 1;
            background: var(--surface);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            border: 2px solid #eef2f7;
        }

        /* --- PETIT GUIDE --- */
        .mini-guide {
            background: linear-gradient(135deg, #181c32 0%, #2b2b40 100%);
            color: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-around;
        }
        .guide-step { text-align: center; font-size: 0.75rem; }
        .guide-step i { font-size: 1.2rem; color: var(--accent); margin-bottom: 5px; display: block; }

        /* --- FORM CARD --- */
        .card-pro {
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            border: 1px solid #eef2f7;
        }

        /* --- SCROLLBAR CUSTOM --- */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* --- MESSAGE BUBBLES --- */
        .msg-bubble {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            position: relative;
            transition: 0.3s;
        }
        .msg-bubble:hover { transform: scale(1.02); background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .btn-delete-small {
            position: absolute; top: 10px; right: 10px;
            color: #ccc; border: none; background: none; font-size: 0.8rem;
        }
        .btn-delete-small:hover { color: #f1416c; }

        .input-fun {
            border: 2px solid #f1f4f9;
            border-radius: 12px;
            padding: 12px;
            transition: 0.3s;
            background: #f8f9fa;
        }
        .input-fun:focus { border-color: var(--primary); background: white; box-shadow: none; outline: none; }
    </style>
</head>
<body>

<nav class="d-flex justify-content-between align-items-center px-5 py-3 bg-white shadow-sm">
    <div class="mascot-container">
        <i class="fas fa-robot mascot-icon"></i>
        <div>
            <h4 class="fw-800 m-0 text-dark">Support<span class="text-primary">Buddy</span></h4>
            <small class="text-muted fw-600">On est là pour vous !</small>
        </div>
    </div>
    <a th:href="@{/}" class="btn btn-light rounded-pill px-4 border fw-700">Retour</a>
</nav>

<div class="app-container">
    
    <div class="left-panel custom-scroll">
        
        <div class="card-pro">
            <h3 class="fw-800 mb-4">Envoyer un <span class="text-primary">billet</span></h3>
            <form th:action="@{/contact/envoyer}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="small fw-800 text-muted mb-2">VOTRE NOM</label>
                        <input type="text" class="form-control input-fun" th:value="${session.userConnecte.nom}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="small fw-800 text-muted mb-2">VOTRE EMAIL</label>
                        <input type="text" class="form-control input-fun" th:value="${session.userConnecte.email}" readonly>
                    </div>
                    <div class="col-12">
                        <label class="small fw-800 text-muted mb-2">QUEL EST LE SUJET ?</label>
                        <select name="sujet" class="form-select input-fun" required>
                            <option value="Technique">⚙️ Un truc ne marche pas</option>
                            <option value="Annonce">📝 Mes annonces</option>
                            <option value="Sécurité">🛡️ Signalement / Sécurité</option>
                            <option value="Autre">✨ Autre chose</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="small fw-800 text-muted mb-2">DITES-NOUS TOUT</label>
                        <textarea name="contenu" class="form-control input-fun" rows="4" placeholder="Écrivez votre message ici..." required></textarea>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-800 shadow-sm">
                            LANCER LE MESSAGE <i class="fas fa-rocket ms-2"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="mini-guide">
            <div class="guide-step">
                <i class="fas fa-pen-nib"></i>
                <span class="fw-600">Écrivez</span>
            </div>
            <div class="guide-step">
                <i class="fas fa-clock"></i>
                <span class="fw-600">Attendez < 24h</span>
            </div>
            <div class="guide-step">
                <i class="fas fa-check-double"></i>
                <span class="fw-600">Problème résolu !</span>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="p-4 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="fw-800 m-0">Mes messages <span class="badge bg-primary rounded-pill ms-2" th:text="${messages.size()}">0</span></h5>
        </div>

        <div class="p-4 flex-grow-1 overflow-y-auto custom-scroll">
            <div th:each="m : ${messages}" class="msg-bubble">
                <a th:href="@{'/contact/supprimer/' + ${m.id}}" class="btn-delete-small">
                    <i class="fas fa-times"></i>
                </a>
                
                <div class="d-flex justify-content-between mb-2">
                    <span th:class="${m.reponse != null ? 'text-success' : 'text-warning'}" class="fw-800 small" style="font-size: 0.65rem;">
                        <i class="fas fa-circle me-1" style="font-size: 0.5rem;"></i>
                        <span th:text="${m.reponse != null ? 'RÉPONDU' : 'EN ATTENTE'}"></span>
                    </span>
                    <small class="text-muted" style="font-size: 0.65rem;" th:text="${#temporals.format(m.dateEnvoi, 'dd MMM, HH:mm')}"></small>
                </div>

                <h6 class="fw-700 mb-1" style="font-size: 0.85rem;" th:text="${m.sujet}">Sujet</h6>
                <p class="text-muted small mb-0" th:text="${m.contenu}"></p>

                <div th:if="${m.reponse != null}" class="mt-3 p-2 bg-white rounded-3 border-start border-primary border-3">
                    <div class="d-flex align-items-center mb-1">
                        <i class="fas fa-user-tie text-primary me-2" style="font-size: 0.7rem;"></i>
                        <strong class="small" style="font-size: 0.7rem;">L'ÉQUIPE ADMIN</strong>
                    </div>
                    <p class="small mb-0 text-dark" th:text="${m.reponse}"></p>
                </div>
            </div>

            <div th:if="${messages.empty}" class="text-center py-5">
                <i class="fas fa-comment-dots text-muted opacity-20 fa-3x mb-3"></i>
                <p class="text-muted small fw-600">Pas encore d'échanges.</p>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
