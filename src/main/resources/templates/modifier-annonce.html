<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnnoncesPro | Édition Premium</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --accent: #f59e0b;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .edit-container {
            max-width: 900px;
            margin: 40px auto;
            position: relative;
        }

        /* Effet de décoration en arrière-plan */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-soft);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            top: -50px;
            right: -50px;
        }

        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 40px;
        }

        .section-title {
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #475569;
        }

        .form-control, .form-select {
            border-radius: 15px;
            padding: 14px 18px;
            border: 2px solid #f1f5f9;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .image-preview-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 3px dashed #cbd5e1;
            background: #f1f5f9;
            text-align: center;
            padding: 20px;
            transition: 0.3s;
        }

        .image-preview-wrapper img {
            max-height: 250px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-modern-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 16px 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .btn-modern-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4);
            color: white;
        }

        .btn-cancel {
            border-radius: 18px;
            padding: 16px;
            font-weight: 600;
            color: #64748b;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-cancel:hover { color: #ef4444; background: #fee2e2; }

        /* Animation d'entrée */
        .fade-in {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container edit-container fade-in">
        <div class="blob"></div>
        
        <div class="glass-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a th:href="@{/}" class="btn-cancel px-3 py-2"><i class="fas fa-chevron-left me-2"></i> Retour</a>
                <span class="badge bg-soft-primary text-primary px-3 py-2" style="background: var(--primary-soft);">ID Annonce: #<span th:text="${annonce.id}">00</span></span>
            </div>

            <h1 class="section-title">Éditer votre publication</h1>

            <form th:action="@{/annonce/modifier}" th:object="${annonce}" method="post" enctype="multipart/form-data">
                
                <input type="hidden" th:field="*{id}">

                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label"><i class="fas fa-tag me-2 text-primary"></i>Titre de l'annonce</label>
                        <input type="text" th:field="*{titre}" class="form-control" placeholder="Entrez un titre accrocheur" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-money-bill-wave me-2 text-primary"></i>Prix (MAD)</label>
                        <input type="number" th:field="*{prix}" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-th-large me-2 text-primary"></i>Catégorie</label>
                        <select th:field="*{categorie}" class="form-select">
                            <option value="Auto">Véhicules</option>
                            <option value="Immo">Immobilier</option>
                            <option value="Tech">Informatique</option>
                            <option value="Mode">Mode & Beauté</option>
                            <option value="Maison">Maison</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label"><i class="fas fa-map-marker-alt me-2 text-primary"></i>Ville</label>
                        <input type="text" th:field="*{ville}" class="form-control" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label"><i class="fas fa-align-left me-2 text-primary"></i>Description complète</label>
                        <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Détails, état, options..."></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label"><i class="fas fa-image me-2 text-primary"></i>Visuel de l'annonce</label>
                        <div class="image-preview-wrapper mb-3">
                            <div th:if="${annonce.imageNom != null}">
                                <img th:src="@{'/uploads/' + ${annonce.imageNom}}" alt="Preview">
                                <p class="mt-3 small text-muted">Aperçu actuel</p>
                            </div>
                            <div th:unless="${annonce.imageNom != null}" class="py-4">
                                <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
                                <p class="mb-0 text-muted">Aucune image sélectionnée</p>
                            </div>
                        </div>
                        <input type="file" name="imageFile" class="form-control">
                        <div class="form-text mt-2">Format accepté : JPG, PNG (Max 5Mo).</div>
                    </div>

                    <div class="col-12 mt-5">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <button type="submit" class="btn-modern-primary w-100">
                                    <i class="fas fa-save"></i> Mettre à jour l'annonce
                                </button>
                            </div>
                            <div class="col-md-4 text-center">
                                <a th:href="@{/}" class="btn-cancel">Annuler</a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
