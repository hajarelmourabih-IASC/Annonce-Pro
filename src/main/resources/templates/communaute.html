<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Cercle | Communauté AnnoncesPro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --secondary: #f8fafc; }

        body {
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .main-wrapper {
            height: calc(100vh - 70px);
            padding: 20px;
        }

        .card-custom {
            background: white;
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            height: 100%;
        }

        /* Membres */
        .member-list { height: 100%; overflow-y: auto; }

        .member-item {
            border-radius: 12px;
            transition: 0.3s;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .member-item:hover {
            background: #eff6ff;
            transform: scale(1.02);
        }

        /* Chat */
        .chat-container { display: flex; flex-direction: column; height: 100%; }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
            border-radius: 15px;
        }

        .msg-bubble {
            background: white;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            max-width: 80%;
        }

        /* Mood */
        .vibe-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 50px;
        }

        .vibe-hot { background: #fee2e2; color: #ef4444; }
        .vibe-cool { background: #dbeafe; color: #3b82f6; }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top" style="height: 70px;">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">
            <i class="fas fa-rocket me-2"></i>ANNONCESPRO
        </a>

        <div class="d-flex align-items-center gap-3">
            <div class="text-end d-none d-md-block" th:if="${session.userConnecte != null}">
                <small class="text-muted d-block">Connecté en tant que</small>
                <span class="fw-bold" th:text="${session.userConnecte.nom}">Utilisateur</span>
            </div>

            <a th:href="@{/}" class="btn btn-light rounded-pill px-4">Quitter</a>
        </div>
    </div>
</nav>

<div class="container-fluid main-wrapper">
    <div class="row h-100 g-4">

        <!-- MEMBRES -->
        <div class="col-md-3 h-100">
            <div class="card card-custom p-3">
                <h5 class="fw-bold mb-3">
                    <i class="fas fa-users text-primary me-2"></i>Membres
                </h5>

                <div class="member-list">

                    <a th:each="m : ${membres}"
                       th:href="@{'/profil/' + ${m.id}}"
                       class="member-item p-2 d-flex align-items-center gap-3 text-decoration-none text-dark">

                        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                             style="width: 40px; height: 40px; font-weight: 700;"
                             th:text="${m.nom.substring(0,1).toUpperCase()}">
                            U
                        </div>

                        <div>
                            <div class="fw-semibold" th:text="${m.nom}">Nom</div>

                            <span class="vibe-badge"
                                  th:classappend="${m.mood == 'Hot'} ? 'vibe-hot' : 'vibe-cool'"
                                  th:text="${m.mood != null ? m.mood : 'Normal'}">
                                Mood
                            </span>
                        </div>

                    </a>

                </div>
            </div>
        </div>

        <!-- CHAT -->
        <div class="col-md-6 h-100">
            <div class="card card-custom p-3">
                <div class="chat-container">

                    <h5 class="fw-bold mb-3">
                        <i class="fas fa-comments text-success me-2"></i>Chat Global
                    </h5>

                    <div class="chat-messages" id="chatBox">

                        <div th:each="msg : ${chatHistory}" class="mb-3">
                            <div class="msg-bubble">
                                <small class="fw-bold text-primary d-block" th:text="${msg.nom}">Auteur</small>
                                <span th:text="${msg.contenu}">Message</span>
                            </div>

                            <small class="text-muted ms-2"
                                   style="font-size: 0.7rem;"
                                   th:text="${#temporals.format(msg.dateEnvoi, 'HH:mm')}">
                                12:00
                            </small>
                        </div>

                    </div>

                    <div class="mt-3">
                        <div class="input-group bg-light rounded-pill p-1">
                            <input type="text" id="messageInput"
                                   class="form-control border-0 bg-transparent px-3"
                                   placeholder="Écrire un message...">

                            <button class="btn btn-primary rounded-pill px-4" onclick="envoyerMessage()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- VENTES -->
        <div class="col-md-3 h-100">
            <div class="card card-custom p-3">
                <h5 class="fw-bold mb-3">
                    <i class="fas fa-trophy text-warning me-2"></i>Ventes
                </h5>

                <div class="overflow-auto">

                    <div th:each="s : ${stories}" class="p-3 mb-3 border rounded-4 bg-light">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="fas fa-check-circle text-success"></i>
                            <span class="fw-bold" th:text="${s.titre}">Objet</span>
                        </div>

                        <small class="text-muted">
                            Vendu par <strong th:text="${s.utilisateur.nom}">Nom</strong>
                        </small>
                    </div>

                    <div th:if="${stories.isEmpty()}" class="text-center py-5 opacity-50">
                        <i class="fas fa-ghost fa-2x mb-2"></i>
                        <p>Aucune vente</p>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    chatBox.scrollTop = chatBox.scrollHeight;

    function envoyerMessage() {
        const input = document.getElementById('messageInput');
        const texte = input.value;

        if (!texte.trim()) return;

        fetch('/api/chat/envoyer?texte=' + encodeURIComponent(texte), { method: 'POST' })
            .then(response => {
                if(response.ok) {
                    input.value = '';
                    location.reload();
                }
            });
    }

    document.getElementById('messageInput')
        .addEventListener('keypress', function (e) {
            if (e.key === 'Enter') envoyerMessage();
        });
</script>

</body>
</html>
